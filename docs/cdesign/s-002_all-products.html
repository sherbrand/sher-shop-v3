<!-- @dsCard group="7. Pages" viewport="1280x900" name="S-002 — All Products" subtitle="Shop hub · breadcrumb, category pills, view toggle, product grid, editorial bands" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Modern Womenswear by SHER</title>
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;height:100%;background:#c9c6bf;font-family:var(--font-body)}
  #stage{position:fixed;inset:0;display:flex;overflow:auto;padding:20px;
    justify-content:safe center;align-items:safe center}
  .frame{position:relative;flex:none;background:var(--surface-page);
    box-shadow:0 10px 60px rgba(51,50,49,.28);overflow:hidden;
    container:sherframe / size;transform:translateZ(0)}
  .frame[data-device="mobile"]{width:390px;height:844px}
  .frame[data-device="tablet"]{width:834px;height:1112px}
  .frame[data-device="desktop"]{width:100%;max-width:1440px;height:100%}
  .frame[data-device="wide"]{width:100%;min-width:1440px;max-width:1920px;height:100%}
  .scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}

  #root{--fs-hero:var(--size-hero-sm);--fs-body:var(--size-body-sm);--fs-item:var(--size-item-sm);--announce-h:2rem}
  .sec{padding:var(--space-7) var(--gutter)}
  .wrap{max-width:var(--container);margin:0 auto}
  .center{text-align:center}

  .head{display:flex;flex-direction:column;gap:var(--space-4);align-items:center;text-align:center}
  .head h1{margin:0;font-size:var(--fs-hero);max-width:none}
  @container sherframe (min-width:640px){ .head h1{text-wrap:nowrap} }
  .head p{margin:0;color:var(--text-default);font-size:var(--fs-body);max-width:72ch}
  .pills{display:flex;flex-wrap:wrap;gap:var(--space-3);justify-content:center}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);
    margin-bottom:var(--space-5);border-bottom:1px solid var(--border-default);padding-bottom:var(--space-4)}
  .toolbar .count{font-family:var(--font-body);font-size:var(--size-xs);letter-spacing:var(--tracking-label);
    text-transform:uppercase;color:var(--text-meta)}

  .pgrid{display:grid;gap:var(--space-4)}

  /* page tuning only — C-ShopEditorial owns the band's internal layout */
  .editorial{padding-top:var(--space-4)}
  section.sec:has(> .wrap > .editorial){padding-top:var(--space-5);padding-bottom:var(--space-5)}
  .pgrid.comfortable{grid-template-columns:1fr}
  .pgrid.compact{grid-template-columns:1fr 1fr}

  @container sherframe (min-width:640px){
    #root{--fs-hero:var(--size-hero-md);--fs-body:var(--size-body-md);--fs-item:var(--size-item-md);--gutter:var(--space-5);--announce-h:2.25rem}
    .sec{padding:var(--space-8) var(--gutter)}
    .pgrid{gap:var(--space-5)}
  }
  @container sherframe (min-width:768px){
    .editorial{padding-top:0}
    section.sec:has(> .wrap > .editorial){padding-top:var(--space-6);padding-bottom:var(--space-6)}
    .pgrid.comfortable{grid-template-columns:1fr}
    .pgrid.compact{grid-template-columns:1fr 1fr}
  }
  @container sherframe (min-width:1024px){
    .sec{padding:var(--space-9) var(--gutter)}
    section.sec:has(> .wrap > .editorial){padding-top:var(--space-7);padding-bottom:var(--space-7)}
    .pgrid.compact{grid-template-columns:1fr 1fr 1fr}
    .pgrid.comfortable{grid-template-columns:1fr 1fr}
    .stg-body{grid-template-columns:1fr}
    #root{--fs-hero:var(--size-hero-lg);--fs-body:var(--size-body-lg);--fs-item:var(--size-item-lg);--gutter:var(--space-6)}
  }

  /* Staging direction: flatten small sentence-case UI tracking (footer/menu links,
     checkout note) via the documented custom property. Main keeps the 0.02em default. */
  #root[data-mode="staging"]{--tracking-item:var(--tracking-body)}
  /* Staging: ShopTitle's description picks up a hair of tracking (Main stays at 0) */
  #root[data-mode="staging"] header.sher-band > .t-body{letter-spacing:0.02em}

  /* staging alt direction: left category rail + right grid */
  /* Staging lead: steps 14 / 16 / 18 (mobile / tablet / desktop) */
  .stg-lead{font-size:var(--fs-body)}
  .stg-body{display:grid;grid-template-columns:1fr;gap:var(--space-6)}
  .stg-rail{display:flex;flex-wrap:wrap;gap:var(--space-3)}
  .stg-head{display:flex;flex-direction:column;gap:var(--space-3);align-items:flex-start;text-align:left}
  .stg-head h1{margin:0;font-size:var(--fs-hero)}

  #sw{position:fixed;z-index:2000;display:flex;gap:6px;padding:6px;border-radius:var(--radius-md);
    background:var(--surface-inverse);box-shadow:0 6px 24px rgba(51,50,49,.35)}
  #sw.c0{top:14px;left:14px}#sw.c1{top:14px;right:14px}#sw.c2{bottom:14px;right:14px}#sw.c3{bottom:14px;left:14px}
  #sw button{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
    border:none;border-radius:var(--radius-sm);background:transparent;color:#cfcac2;cursor:pointer;padding:0}
  #sw button:hover{color:#fff}#sw button.act{background:rgba(250,249,246,.16);color:#fff}
  #sw .sep{width:1px;background:rgba(250,249,246,.2);margin:2px 2px}
  #sw svg{width:17px;height:17px;display:block}
</style>
</head>
<body>
<div id="sw" class="c1"></div>
<div id="stage"><div class="frame" id="frame" data-device="desktop"><div class="scroll" id="scroll"><div id="root"></div></div></div></div>

<script src="image-slot.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>

<script>
(function(){
  var ICON={
    mobile:'<rect x="7" y="3" width="10" height="18" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/>',
    tablet:'<rect x="5" y="3" width="14" height="18" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/>',
    desktop:'<rect x="3" y="4" width="18" height="12" rx="2"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/>',
    wide:'<rect x="1" y="6" width="22" height="10" rx="2"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/>',
    main:'<circle cx="12" cy="12" r="8"/>',
    staging:'<circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/>',
    rotate:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>'
  };
  function svg(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
  var state={device:'desktop',mode:'main',corner:1};
  var sw=document.getElementById('sw'), frame=document.getElementById('frame');
  function btn(icon,title,on){var b=document.createElement('button');b.innerHTML=svg(ICON[icon]);b.title=title;b.setAttribute('aria-label',title);b.onclick=on;return b;}
  function render(){
    sw.className='c'+state.corner; sw.innerHTML='';
    [['mobile','Mobile'],['tablet','Tablet'],['desktop','Desktop'],['wide','Wide']].forEach(function(d){
      var b=btn(d[0],d[1]+' view',function(){state.device=d[0];apply();});
      if(state.device===d[0])b.classList.add('act');sw.appendChild(b);});
    var s1=document.createElement('div');s1.className='sep';sw.appendChild(s1);
    var mb=btn(state.mode==='main'?'main':'staging',state.mode==='main'?'Main direction':'Staging direction',function(){state.mode=(state.mode==='main'?'staging':'main');apply();});
    mb.classList.add('act');sw.appendChild(mb);
    var s2=document.createElement('div');s2.className='sep';sw.appendChild(s2);
    sw.appendChild(btn('rotate','Move panel',function(){state.corner=(state.corner+1)%4;render();}));
  }
  function apply(){frame.setAttribute('data-device',state.device);render();if(window.__renderApp)window.__renderApp(state.mode);}
  window.__swInit=apply; render();
})();
</script>

<script type="text/babel">
const NS = window.SHERDesignSystem_84f0d7;
const { Sticky, Menu, Cart, Footer, Breadcrumb, ButtonPill, ViewToggle, ProductCard, ShopTitle, ProductGrid, Price, ShopEditorial, Button } = NS;

const CATS = [
  { label: "Corset Tops", href: "/shop/corset-tops" },
  { label: "Matching Sets", href: "/shop/matching-sets" },
  { label: "Cocktail Dresses", href: "/shop/cocktail-dresses" },
];
const PRODUCTS = [
  { id: "p-1", title: "Silk Lace Corset Top", price: 240, category: "Corset Tops" },
  { id: "p-2", title: "Odile Zip Corset", price: 210, soldOut: true, category: "Corset Tops" },
  { id: "p-3", title: "Séraphine Lace Corset", price: 230, category: "Corset Tops" },
  { id: "p-4", title: "Satin Trouser Set", price: 295, compareAt: 340, category: "Matching Sets" },
  { id: "p-5", title: "Rue Skirt Set", price: 275, category: "Matching Sets" },
  { id: "p-6", title: "Aria Slip Midi", price: 260, category: "Cocktail Dresses" },
  { id: "p-7", title: "Noir Cocktail Mini", price: 245, category: "Cocktail Dresses" },
  { id: "p-8", title: "Ivory Maxi Slip", price: 320, category: "Cocktail Dresses" },
  { id: "p-9", title: "Colette Corset Top", price: 220, category: "Corset Tops" },
  { id: "p-10", title: "Amara Lace Corset", price: 250, category: "Corset Tops" },
  { id: "p-11", title: "Odette Skirt Set", price: 340, category: "Matching Sets" },
  { id: "p-12", title: "Vesper Trouser Set", price: 370, category: "Matching Sets" },
  { id: "p-13", title: "Lys Satin Maxi", price: 330, category: "Cocktail Dresses" },
  { id: "p-14", title: "Mira Zip Corset", price: 225, category: "Corset Tops" },
  { id: "p-15", title: "Elodie Slip Midi", price: 275, category: "Cocktail Dresses" },
  { id: "p-16", title: "Ines Skirt Set", price: 342, category: "Matching Sets" },
  { id: "p-17", title: "Juno Lace Bustier", price: 240, soldOut: true, category: "Corset Tops" },
  { id: "p-18", title: "Sable Satin Mini", price: 252, category: "Cocktail Dresses" },
  { id: "p-19", title: "Vesper Zip Corset", price: 215, category: "Corset Tops" },
  { id: "p-20", title: "Maren Trouser Set", price: 358, category: "Matching Sets" },
  { id: "p-21", title: "Thea Slip Midi", price: 272, category: "Cocktail Dresses" },
  { id: "p-22", title: "Noor Lace Corset", price: 255, category: "Corset Tops" },
  { id: "p-23", title: "Rive Skirt Set", price: 348, category: "Matching Sets" },
  { id: "p-24", title: "Ines Satin Maxi", price: 335, category: "Cocktail Dresses" },
  { id: "p-25", title: "Juno Trouser Set", price: 365, category: "Matching Sets" },
  { id: "p-26", title: "Aurelie Satin Mini", price: 248, category: "Cocktail Dresses" },
];
const slot = (id, title) => (
  <image-slot id={id} shape="rect" placeholder={title}
    style={{ position: "absolute", inset: 0, width: "100%", height: "100%" }} />
);

const BANDS = [
  { id: "s2-corsets", eyebrow: "About our Product", heading: "More about our Corset Tops",
    paragraph: "We build every corset top by hand. Each bone is set one at a time on a mannequin, not laid flat by a machine, so the shape holds to the body. Inside, a satin lining and structured bust cups keep the fit clean and comfortable. The result is a top that reads elegant, never cheap.",
    btn: "Explore Corset Tops", href: "/corset-tops",
    ph: "A SHER corset top showing hand-set boning channels and back lacing." },
  { id: "s2-sets", eyebrow: "About our Product", heading: "More about our Matching Sets",
    paragraph: "A matching set does the styling for you. We pair a hand-built corset top with a skirt or trousers cut to match, so the whole look lands as one. The Skirt Set softens the line; the Trouser Set sharpens it. Either way, you walk in ready to be seen.",
    btn: "Explore Matching Sets", href: "/matching-sets",
    ph: "A SHER matching set: a corset top with matching trousers on a model." },
  { id: "s2-dresses", eyebrow: "About our Product", heading: "More about our Cocktail Dresses",
    paragraph: "Our cocktail dresses are made for the moments people look. We cut them in satin and soft slip shapes that skim the body and catch the light. Choose the length that fits the night: Mini, Midi, or Maxi. Each one is built to hold a room.",
    btn: "Explore Cocktail Dresses", href: "/cocktail-dresses",
    ph: "A SHER cocktail dress in satin on a model, cut in a slip shape." },
];

function MainShop({ openMenu, openCart }) {
  const [view, setView] = React.useState("comfortable");
  return (
    <>
      <section className="sec" style={{ paddingBottom: "var(--space-5)" }}>
        <div className="wrap">
          <ShopTitle
            breadcrumb={[{ label: "Home", href: "/" }, { label: "Shop" }]}
            heading="Shop Modern Womenswear"
            description="Every SHER piece in one place. Corset tops with structure you can feel. Matching sets that land as one look. Cocktail dresses in satin that catches the light. Three categories, one standard."
            filters={CATS.map((c) => ({ label: c.label, href: c.href }))} />
        </div>
      </section>

      <section className="sec" style={{ paddingTop: 0 }}>
        <div className="wrap">
          <ProductGrid products={PRODUCTS.map((p) => ({ ...p, href: "/shop", media: slot(p.id, p.title) }))}
            columns={view === "compact" ? "2/2/3" : "1/1/2"} onView={setView} pageSize={12} endMark="mark" />
        </div>
      </section>

      {BANDS.map((b, i) => (
        <section key={b.id} className="sec"
          style={{ background: i % 2 === 1 ? "var(--surface-tint)" : "var(--surface-raised)" }}>
          <div className="wrap">
            <ShopEditorial className="editorial" mirror={i % 2 === 1} mobileFirst="text" mobileAlign={i % 2 === 0 ? "right" : "left"}
              eyebrow={b.eyebrow} heading={b.heading} paragraph={b.paragraph}
              media={slot(b.id, b.ph)}>
              <Button as="a" href={b.href} variant="secondary">{b.btn}</Button>
            </ShopEditorial>
          </div>
        </section>
      ))}
    </>
  );
}

function StagingShop({ openMenu, openCart }) {
  const [view, setView] = React.useState("comfortable");
  return (
    <>
    <section className="sec stg">
      <div className="wrap">
        <ShopTitle align="center" style={{ marginBottom: "var(--space-6)" }}
          breadcrumb={[{ label: "Home", href: "/" }, { label: "Shop" }]}
          heading="Shop All Womenswear"
          description="Every SHER piece in one place. Corset tops with structure you can feel. Matching sets that land as one look. Cocktail dresses in satin that catches the light. Three categories, one standard."
          measure="72ch"
          filters={CATS.map((c) => ({ label: c.label, href: c.href }))} />
        <div className="stg-body">
          <div>
            <ProductGrid products={PRODUCTS.map((p) => ({ ...p, href: "/shop", media: slot(p.id, p.title) }))}
              columns={view === "compact" ? "2/2/3" : "1/1/2"} onView={setView} pageSize={12} endMark="monogram" />
          </div>
        </div>
      </div>
    </section>

    {BANDS.map((b, i) => (
      <section key={b.id} className="sec"
        style={{ background: i % 2 === 1 ? "var(--surface-tint)" : "var(--surface-raised)" }}>
        <div className="wrap">
          <ShopEditorial className="editorial" mirror={i % 2 === 1} mobileFirst="text"
            mobileAlign={i % 2 === 0 ? "right" : "left"} headingFont="body"
            eyebrow={b.eyebrow} heading={b.heading} paragraph={b.paragraph}
            media={slot("stg-" + b.id, b.ph)}>
            <Button as="a" href={b.href} variant="secondary">{b.btn}</Button>
          </ShopEditorial>
        </div>
      </section>
    ))}
    </>
  );
}

function App() {
  const [mode, setMode] = React.useState("main");
  // reflect the direction on #root so Staging can flatten --tracking-item to 0
  React.useEffect(() => {
    const r = document.getElementById("root");
    if (r) r.setAttribute("data-mode", mode);
  }, [mode]);
  const [menuOpen, setMenuOpen] = React.useState(false);
  const [cartOpen, setCartOpen] = React.useState(false);
  React.useEffect(() => {
    window.__renderApp = (m) => setMode(m);
    if (window.__swInit) window.__swInit();
  }, []);
  const openMenu = () => setMenuOpen(true), openCart = () => setCartOpen(true);
  return (
    <>
      <Sticky cartCount={0} onMenu={openMenu} onCart={openCart}
        key={mode} announcementTone={mode === "main" ? "light" : "accent"} />
      {mode === "main"
        ? <MainShop openMenu={openMenu} openCart={openCart} />
        : <StagingShop openMenu={openMenu} openCart={openCart} />}
      <Footer year={2026} />
      <Menu open={menuOpen} onClose={() => setMenuOpen(false)} onNavigate={() => {}} />
      <Cart open={cartOpen} onClose={() => setCartOpen(false)} items={[]} />
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

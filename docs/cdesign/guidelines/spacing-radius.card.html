<!-- @dsCard group="4. Spacing" viewport="700x220" name="Radius & Depth" subtitle="Small radii; restrained, tonal depth" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--surface-page)}</style></head><body>
<div style="display:flex;gap:32px;align-items:flex-end;flex-wrap:wrap">
  <div style="text-align:center"><div style="width:80px;height:56px;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:0"></div><div style="font-family:var(--font-body);font-size:11px;color:var(--text-meta);margin-top:8px">none · 0</div></div>
  <div style="text-align:center"><div style="width:80px;height:56px;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:2px"></div><div style="font-family:var(--font-body);font-size:11px;color:var(--text-meta);margin-top:8px">sm · 2px</div></div>
  <div style="text-align:center"><div style="width:80px;height:56px;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:4px"></div><div style="font-family:var(--font-body);font-size:11px;color:var(--text-meta);margin-top:8px">md · 4px</div></div>
  <div style="text-align:center"><div style="width:120px;height:44px;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:999px"></div><div style="font-family:var(--font-body);font-size:11px;color:var(--text-meta);margin-top:8px">pill</div></div>
  <div style="text-align:center"><div style="width:80px;height:56px;background:var(--surface-page);border-radius:4px;box-shadow:0 4px 24px rgba(51,50,49,.08)"></div><div style="font-family:var(--font-body);font-size:11px;color:var(--text-meta);margin-top:8px">raised</div></div>
  <div style="text-align:center"><div style="width:80px;height:56px;background:var(--surface-page);border-radius:4px;box-shadow:-8px 0 40px rgba(51,50,49,.12)"></div><div style="font-family:var(--font-body);font-size:11px;color:var(--text-meta);margin-top:8px">drawer</div></div>
</div></body></html>

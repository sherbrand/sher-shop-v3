<!-- @dsCard group="2. Colors" viewport="700x180" name="Core Palette" subtitle="Warm tonal neutrals — the full set, never go outside it" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--surface-page)}</style></head><body>
<div style="display:flex;gap:12px">
  <div style="flex:1"><div style="height:72px;background:var(--sher-background);border:1px solid var(--border-default);border-radius:2px;display:flex;align-items:flex-end;padding:8px"><span style="font-family:var(--font-body);font-size:11px;color:var(--text-default)">#FAF9F6</span></div>
<div style="font-family:var(--font-body);font-size:12px;color:var(--text-default);margin-top:8px"><strong style="color:var(--text-strong)">Background</strong></div></div>
  <div style="flex:1"><div style="height:72px;background:var(--sher-tint);border:1px solid var(--border-default);border-radius:2px;display:flex;align-items:flex-end;padding:8px"><span style="font-family:var(--font-body);font-size:11px;color:var(--text-default)">#EFEBE7</span></div>
<div style="font-family:var(--font-body);font-size:12px;color:var(--text-default);margin-top:8px"><strong style="color:var(--text-strong)">Tint</strong></div></div>
  <div style="flex:1"><div style="height:72px;background:var(--sher-surface);border:1px solid var(--border-default);border-radius:2px;display:flex;align-items:flex-end;padding:8px"><span style="font-family:var(--font-body);font-size:11px;color:var(--text-default)">#E4E2DC</span></div>
<div style="font-family:var(--font-body);font-size:12px;color:var(--text-default);margin-top:8px"><strong style="color:var(--text-strong)">Surface</strong></div></div>
  <div style="flex:1"><div style="height:72px;background:var(--sher-primary);border:1px solid var(--border-default);border-radius:2px;display:flex;align-items:flex-end;padding:8px"><span style="font-family:var(--font-body);font-size:11px;color:var(--sher-dark)">#A99D94</span></div>
<div style="font-family:var(--font-body);font-size:12px;color:var(--text-default);margin-top:8px"><strong style="color:var(--text-strong)">Primary</strong></div></div>
  <div style="flex:1"><div style="height:72px;background:var(--sher-accent);border:1px solid var(--border-default);border-radius:2px;display:flex;align-items:flex-end;padding:8px"><span style="font-family:var(--font-body);font-size:11px;color:#fff">#7C736B</span></div>
<div style="font-family:var(--font-body);font-size:12px;color:var(--text-default);margin-top:8px"><strong style="color:var(--text-strong)">Accent</strong></div></div>
  <div style="flex:1"><div style="height:72px;background:var(--sher-muted);border:1px solid var(--border-default);border-radius:2px;display:flex;align-items:flex-end;padding:8px"><span style="font-family:var(--font-body);font-size:11px;color:#fff">#929291</span></div>
<div style="font-family:var(--font-body);font-size:12px;color:var(--text-default);margin-top:8px"><strong style="color:var(--text-strong)">Muted</strong></div></div>
  <div style="flex:1"><div style="height:72px;background:var(--sher-text);border:1px solid var(--border-default);border-radius:2px;display:flex;align-items:flex-end;padding:8px"><span style="font-family:var(--font-body);font-size:11px;color:#fff">#514F4E</span></div>
<div style="font-family:var(--font-body);font-size:12px;color:var(--text-default);margin-top:8px"><strong style="color:var(--text-strong)">Text</strong></div></div>
  <div style="flex:1"><div style="height:72px;background:var(--sher-dark);border:1px solid var(--border-default);border-radius:2px;display:flex;align-items:flex-end;padding:8px"><span style="font-family:var(--font-body);font-size:11px;color:#fff">#333231</span></div>
<div style="font-family:var(--font-body);font-size:12px;color:var(--text-default);margin-top:8px"><strong style="color:var(--text-strong)">Dark</strong></div></div>
</div></body></html>

<!-- @dsCard group="7. Pages" viewport="1280x900" name="S-006 — Product Detail" subtitle="Product page · media gallery, size + quantity, add to cart, drawers, related grid" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silk Lace Corset Top — SHER</title>
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;height:100%;background:#c9c6bf;font-family:var(--font-body)}
  #stage{position:fixed;inset:0;display:flex;overflow:auto;padding:20px;
    justify-content:safe center;align-items:safe center}
  .frame{position:relative;flex:none;background:var(--surface-page);
    box-shadow:0 10px 60px rgba(51,50,49,.28);overflow:hidden;
    container:sherframe / size;transform:translateZ(0)}
  .frame[data-device="mobile"]{width:390px;height:844px}
  .frame[data-device="tablet"]{width:834px;height:1112px}
  .frame[data-device="desktop"]{width:100%;max-width:1440px;height:100%}
  .frame[data-device="wide"]{width:100%;min-width:1440px;max-width:1920px;height:100%}
  .scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}

  #root{--fs-hero:var(--size-hero-sm);--fs-section:var(--size-section-sm);--fs-body:var(--size-body-sm);--fs-item:var(--size-item-sm);--announce-h:2rem;--fs-display:var(--size-display-sm)}
  .sec{padding:var(--space-7) var(--gutter)}
  .wrap{max-width:var(--container);margin:0 auto}
  .prose{max-width:var(--container-prose);margin:0 auto}

  .pgrid{display:grid;gap:var(--space-4)}
  .editorial{padding-top:var(--space-4)}
  /* editorial bands run more compact than a standard section */
  section.sec:has(> .wrap > .editorial){padding-top:var(--space-5);padding-bottom:var(--space-5)}
  /* Staging: a double hairline marks the shift out of the grid */
  .stg-band.first-band{border-top:3px double var(--border-strong)}
  .stg-band + .stg-band{border-top:1px solid var(--border-default)}


  @container sherframe (min-width:640px){
    #root{--fs-hero:var(--size-hero-md);--fs-section:var(--size-section-md);--fs-body:var(--size-body-md);--fs-item:var(--size-item-md);--gutter:var(--space-5);--announce-h:2.25rem;--fs-display:var(--size-display-md)}
    .sec{padding:var(--space-8) var(--gutter)}
  }
  @container sherframe (min-width:768px){
    .editorial{padding-top:0}
    section.sec:has(> .wrap > .editorial){padding-top:var(--space-6);padding-bottom:var(--space-6)}
  }
  @container sherframe (min-width:1024px){
    #root{--fs-hero:var(--size-hero-lg);--fs-section:var(--size-section-lg);--gutter:var(--space-6);--fs-body:var(--size-body-lg);--fs-item:var(--size-item-lg);--fs-display:var(--size-display-lg)}
    .sec{padding:var(--space-9) var(--gutter)}
    section.sec:has(> .wrap > .editorial){padding-top:var(--space-7);padding-bottom:var(--space-7)}
  }

  /* staging alt direction */
  .stg-faq{background:var(--surface-raised)}
  .stg-faq .panel{background:var(--surface-page);padding:0 var(--space-5);border-radius:var(--radius-sm)}

  #sw{position:fixed;z-index:2000;display:flex;gap:6px;padding:6px;border-radius:var(--radius-md);
    background:var(--surface-inverse);box-shadow:0 6px 24px rgba(51,50,49,.35)}
  #sw.c0{top:14px;left:14px}#sw.c1{top:14px;right:14px}#sw.c2{bottom:14px;right:14px}#sw.c3{bottom:14px;left:14px}
  #sw button{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
    border:none;border-radius:var(--radius-sm);background:transparent;color:#cfcac2;cursor:pointer;padding:0}
  #sw button:hover{color:#fff}#sw button.act{background:rgba(250,249,246,.16);color:#fff}
  #sw .sep{width:1px;background:rgba(250,249,246,.2);margin:2px 2px}
  #sw svg{width:17px;height:17px;display:block}
</style>
</head>
<body>
<div id="sw" class="c1"></div>
<div id="stage"><div class="frame" id="frame" data-device="desktop"><div class="scroll" id="scroll"><div id="root"></div></div></div></div>

<script src="image-slot.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>

<script>
(function(){
  var ICON={
    mobile:'<rect x="7" y="3" width="10" height="18" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/>',
    tablet:'<rect x="5" y="3" width="14" height="18" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/>',
    desktop:'<rect x="3" y="4" width="18" height="12" rx="2"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/>',
    wide:'<rect x="1" y="6" width="22" height="10" rx="2"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/>',
    main:'<circle cx="12" cy="12" r="8"/>',
    staging:'<circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/>',
    rotate:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>'
  };
  function svg(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
  var state={device:'desktop',mode:'main',corner:1};
  var sw=document.getElementById('sw'), frame=document.getElementById('frame');
  function btn(icon,title,on){var b=document.createElement('button');b.innerHTML=svg(ICON[icon]);b.title=title;b.setAttribute('aria-label',title);b.onclick=on;return b;}
  function render(){
    sw.className='c'+state.corner; sw.innerHTML='';
    [['mobile','Mobile'],['tablet','Tablet'],['desktop','Desktop'],['wide','Wide']].forEach(function(d){
      var b=btn(d[0],d[1]+' view',function(){state.device=d[0];apply();});
      if(state.device===d[0])b.classList.add('act');sw.appendChild(b);});
    var s1=document.createElement('div');s1.className='sep';sw.appendChild(s1);
    var mb=btn(state.mode==='main'?'main':'staging',state.mode==='main'?'Main direction':'Staging direction',function(){state.mode=(state.mode==='main'?'staging':'main');apply();});
    mb.classList.add('act');sw.appendChild(mb);
    var s2=document.createElement('div');s2.className='sep';sw.appendChild(s2);
    sw.appendChild(btn('rotate','Move panel',function(){state.corner=(state.corner+1)%4;render();}));
  }
  function apply(){frame.setAttribute('data-device',state.device);render();if(window.__renderApp)window.__renderApp(state.mode);}
  window.__swInit=apply; render();
})();
</script>

<script type="text/babel">
const NS = window.SHERDesignSystem_84f0d7;
const { Sticky, Menu, Cart, Sizing, Shipping, Footer, Breadcrumb, Button, Price,
  ProductPanel, RelatedProducts, MediaGallery } = NS;

const slot = (id, ph) => (
  <image-slot id={id} shape="rect" placeholder={ph}
    style={{ position: "absolute", inset: 0, width: "100%", height: "100%" }} />
);

/* D-001 product + D-005 chart data stand-in */
const PRODUCT = {
  name: "Silk Lace Corset Top",
  price: 240,
  category: "Corset Tops",
  categoryHref: "/corset-tops",
  attributeLabel: "Closure Type",
  attributeValue: "Lace Closure",
  description: "A corset top built on real corsetry. Thin bones run through the fabric to shape the waist and hold the bust, each one set by hand on a mannequin so it follows the curve of a real body. Inside, a satin lining and structured bust cups keep the fit clean.",
  sizes: [{ label: "XS" }, { label: "S" }, { label: "M", soldOut: true }, { label: "L" }, { label: "XL" }],
};

/* media order is fixed: video first, then images */
const MEDIA = [
  { type: "video", node: slot("p6-video", "Product video — corset top on a model"), alt: "Silk Lace Corset Top, video" },
  { type: "image", node: slot("p6-img-1", "Front view, shaped waist and structured bust") },
  { type: "image", node: slot("p6-img-2", "Back view, lacing through metal eyelets") },
  { type: "image", node: slot("p6-img-3", "Inside, satin lining and bust cups") },
];

const RELATED = [
  { id: "r-1", title: "Séraphine Lace Corset", price: 230, category: "Corset Tops", href: "/shop/corset-tops" },
  { id: "r-2", title: "Amara Lace Corset", price: 250, category: "Corset Tops", href: "/shop/corset-tops" },
];

const CHART = {
  measures: [
    { key: "bust", label: "Bust" },
    { key: "waist", label: "Waist" },
    { key: "length", label: "Length" },
  ],
  rows: [
    { size: "XS", cm: { bust: 78, waist: 60, length: 38 } },
    { size: "S", cm: { bust: 82, waist: 64, length: 39 } },
    { size: "M", cm: { bust: 87, waist: 69, length: 40 } },
    { size: "L", cm: { bust: 93, waist: 75, length: 41 } },
    { size: "XL", cm: { bust: 99, waist: 81, length: 42 } },
  ],
};

const CRUMB = [
  { label: "Shop", href: "/shop" },
  { label: PRODUCT.category, href: PRODUCT.categoryHref },
  { label: PRODUCT.name },
];

function MainPage({ openCart, openSizing, openShipping }) {
  const [size, setSize] = React.useState("S");
  const [qty, setQty] = React.useState(1);
  return (
    <>
      {/* S-006 — media gallery beside the purchase column */}
      <section className="sec">
        <div className="wrap">
          <ProductPanel
            breadcrumb={CRUMB} headingLevel={1}
            name={PRODUCT.name} price={PRODUCT.price} description={PRODUCT.description}
            attributeLabel={PRODUCT.attributeLabel} attributeValue={PRODUCT.attributeValue}
            sizes={PRODUCT.sizes} size={size} onSize={setSize}
            quantity={qty} onQuantity={setQty}
            media={MEDIA}
            onAddToCart={openCart}
            onBuyNow={() => window.alert("Buy Now → Shopify hosted checkout (F-006)")}
            onSizeChart={openSizing} onShipping={openShipping} />
        </div>
      </section>

      {/* S-006 — You May Also Like */}
      <section className="sec" style={{ background: "var(--surface-tint)" }}>
        <div className="wrap">
          <RelatedProducts
            subtitle={"See the full " + PRODUCT.category.toLowerCase() + " range, each piece built the same way."}
            backLabel={"Back to " + PRODUCT.category} backHref={PRODUCT.categoryHref}
            products={RELATED.map((p) => ({ ...p, media: slot(p.id, p.title) }))}
            columns="2/2/2" actionsLayout="stack" backVariant="surface">
            <Button as="a" href="/shop" variant="accent" fullWidth>View All Products</Button>
          </RelatedProducts>
        </div>
      </section>
    </>
  );
}

/* Staging — alternate direction: full-bleed gallery above a centred purchase
   column, and the related block on the page background. */
function StagingPage({ openCart, openSizing, openShipping }) {
  const [size, setSize] = React.useState("S");
  const [qty, setQty] = React.useState(1);
  return (
    <>
      <section className="sec" style={{ background: "var(--surface-raised)" }}>
        <div className="wrap">
          <ProductPanel stacked
            breadcrumb={CRUMB} headingLevel={1}
            name={PRODUCT.name} price={PRODUCT.price} description={PRODUCT.description}
            attributeLabel={PRODUCT.attributeLabel} attributeValue={PRODUCT.attributeValue}
            sizes={PRODUCT.sizes} size={size} onSize={setSize}
            quantity={qty} onQuantity={setQty}
            media={MEDIA.map((m, i) => ({ ...m, node: slot("stg-p6-" + i, m.alt || "Product media") }))}
            onAddToCart={openCart}
            onBuyNow={() => window.alert("Buy Now → Shopify hosted checkout (F-006)")}
            onSizeChart={openSizing} onShipping={openShipping} />
        </div>
      </section>

      <section className="sec">
        <div className="wrap">
          <RelatedProducts heading="More From This Category"
            subtitle={"More " + PRODUCT.category.toLowerCase() + " to pair or choose instead."}
            backLabel={"Back to " + PRODUCT.category} backHref={PRODUCT.categoryHref}
            columns="1/2/2"
            products={RELATED.map((p) => ({ ...p, media: slot("stg-" + p.id, p.title) }))} />
        </div>
      </section>
    </>
  );
}

function App() {
  const [mode, setMode] = React.useState("main");
  // reflect the direction on #root so Staging can retone the buy buttons
  React.useEffect(() => {
    const r = document.getElementById("root");
    if (r) r.setAttribute("data-mode", mode);
  }, [mode]);
  const [menuOpen, setMenuOpen] = React.useState(false);
  const [cartOpen, setCartOpen] = React.useState(false);
  const [sizingOpen, setSizingOpen] = React.useState(false);
  const [shippingOpen, setShippingOpen] = React.useState(false);
  const [items, setItems] = React.useState([]);
  React.useEffect(() => {
    window.__renderApp = (m) => setMode(m);
    if (window.__swInit) window.__swInit();
  }, []);
  // F-004: add to cart opens C-Cart
  const addToCart = () => {
    setItems([{ id: "line-1", name: PRODUCT.name, options: "Lace Closure · S",
      price: PRODUCT.price, quantity: 1 }]);
    setCartOpen(true);
  };
  const view = { openCart: addToCart, openSizing: () => setSizingOpen(true),
    openShipping: () => setShippingOpen(true) };
  return (
    <>
      <Sticky cartCount={items.length} onMenu={() => setMenuOpen(true)}
        onCart={() => setCartOpen(true)}
        key={mode} announcementTone={mode === "main" ? "light" : "accent"} />
      {mode === "main" ? <MainPage {...view} /> : <StagingPage {...view} />}
      <Footer year={2026} />
      <Menu open={menuOpen} onClose={() => setMenuOpen(false)} />
      <Cart open={cartOpen} onClose={() => setCartOpen(false)} items={items}
        onRemove={() => setItems([])}
        onQuantityChange={(id, q) => setItems((l) => l.map((it) => it.id === id ? { ...it, quantity: q } : it))} />
      <Sizing open={sizingOpen} onClose={() => setSizingOpen(false)}
        productName={PRODUCT.name} chart={CHART} />
      <Shipping open={shippingOpen} onClose={() => setShippingOpen(false)} />
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

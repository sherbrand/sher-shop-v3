<!-- @dsCard group="7. Pages" viewport="1280x900" name="S-003 — Corset Tops" subtitle="Category + editorial page · closure filter, grid, four editorial bands, FAQ" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corset Tops: Built by Hand for the Modern Woman</title>
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;height:100%;background:#c9c6bf;font-family:var(--font-body)}
  #stage{position:fixed;inset:0;display:flex;overflow:auto;padding:20px;
    justify-content:safe center;align-items:safe center}
  .frame{position:relative;flex:none;background:var(--surface-page);
    box-shadow:0 10px 60px rgba(51,50,49,.28);overflow:hidden;
    container:sherframe / size;transform:translateZ(0)}
  .frame[data-device="mobile"]{width:390px;height:844px}
  .frame[data-device="tablet"]{width:834px;height:1112px}
  .frame[data-device="desktop"]{width:100%;max-width:1440px;height:100%}
  .frame[data-device="wide"]{width:100%;min-width:1440px;max-width:1920px;height:100%}
  .scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}

  #root{--fs-hero:var(--size-hero-sm);--fs-section:var(--size-section-sm);--fs-body:var(--size-body-sm);--fs-item:var(--size-item-sm);--announce-h:2rem;--fs-display:var(--size-display-sm)}
  .sec{padding:var(--space-7) var(--gutter)}
  .wrap{max-width:var(--container);margin:0 auto}
  .prose{max-width:var(--container-prose);margin:0 auto}

  .pgrid{display:grid;gap:var(--space-4)}
  .editorial{padding-top:var(--space-4)}
  /* editorial bands run more compact than a standard section */
  section.sec:has(> .wrap > .editorial){padding-top:var(--space-5);padding-bottom:var(--space-5)}
  /* Staging: a double hairline marks the shift out of the grid */
  .stg-band.first-band{border-top:3px double var(--border-strong)}
  .stg-band + .stg-band{border-top:1px solid var(--border-default)}


  @container sherframe (min-width:640px){
    #root{--fs-hero:var(--size-hero-md);--fs-section:var(--size-section-md);--fs-body:var(--size-body-md);--fs-item:var(--size-item-md);--gutter:var(--space-5);--announce-h:2.25rem;--fs-display:var(--size-display-md)}
    .sec{padding:var(--space-8) var(--gutter)}
  }
  @container sherframe (min-width:768px){
    .editorial{padding-top:0}
    section.sec:has(> .wrap > .editorial){padding-top:var(--space-6);padding-bottom:var(--space-6)}
  }
  @container sherframe (min-width:1024px){
    #root{--fs-hero:var(--size-hero-lg);--fs-section:var(--size-section-lg);--gutter:var(--space-6);--fs-body:var(--size-body-lg);--fs-item:var(--size-item-lg);--fs-display:var(--size-display-lg)}
    .sec{padding:var(--space-9) var(--gutter)}
    section.sec:has(> .wrap > .editorial){padding-top:var(--space-7);padding-bottom:var(--space-7)}
  }

  /* staging alt direction */
  /* FAQ heading centres on mobile only — the band stacks below 768px, so the
     heading sits above the accordion rather than beside it. Container query on the
     band's own width, not the frame. */
  @container (max-width:767.98px){ .sher-shopfaq > .hd{text-align:center} }
  .stg-faq{background:var(--surface-raised)}
  /* Staging trial: centre the FAQ heading text (Staging is exempt from the
     self-contained rule; promote to a ShopFaq prop if we keep it) */
  .stg-faq .sher-shopfaq > .hd{text-align:center;
    font-family:var(--font-body);text-transform:none;letter-spacing:0}
  .stg-faq .panel{background:var(--surface-page);padding:0 var(--space-5);border-radius:var(--radius-sm)}

  #sw{position:fixed;z-index:2000;display:flex;gap:6px;padding:6px;border-radius:var(--radius-md);
    background:var(--surface-inverse);box-shadow:0 6px 24px rgba(51,50,49,.35)}
  #sw.c0{top:14px;left:14px}#sw.c1{top:14px;right:14px}#sw.c2{bottom:14px;right:14px}#sw.c3{bottom:14px;left:14px}
  #sw button{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
    border:none;border-radius:var(--radius-sm);background:transparent;color:#cfcac2;cursor:pointer;padding:0}
  #sw button:hover{color:#fff}#sw button.act{background:rgba(250,249,246,.16);color:#fff}
  #sw .sep{width:1px;background:rgba(250,249,246,.2);margin:2px 2px}
  #sw svg{width:17px;height:17px;display:block}
</style>
</head>
<body>
<div id="sw" class="c1"></div>
<div id="stage"><div class="frame" id="frame" data-device="desktop"><div class="scroll" id="scroll"><div id="root"></div></div></div></div>

<script src="image-slot.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>

<script>
(function(){
  var ICON={
    mobile:'<rect x="7" y="3" width="10" height="18" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/>',
    tablet:'<rect x="5" y="3" width="14" height="18" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/>',
    desktop:'<rect x="3" y="4" width="18" height="12" rx="2"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/>',
    wide:'<rect x="1" y="6" width="22" height="10" rx="2"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/>',
    main:'<circle cx="12" cy="12" r="8"/>',
    staging:'<circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/>',
    rotate:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>'
  };
  function svg(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
  var state={device:'desktop',mode:'main',corner:1};
  var sw=document.getElementById('sw'), frame=document.getElementById('frame');
  function btn(icon,title,on){var b=document.createElement('button');b.innerHTML=svg(ICON[icon]);b.title=title;b.setAttribute('aria-label',title);b.onclick=on;return b;}
  function render(){
    sw.className='c'+state.corner; sw.innerHTML='';
    [['mobile','Mobile'],['tablet','Tablet'],['desktop','Desktop'],['wide','Wide']].forEach(function(d){
      var b=btn(d[0],d[1]+' view',function(){state.device=d[0];apply();});
      if(state.device===d[0])b.classList.add('act');sw.appendChild(b);});
    var s1=document.createElement('div');s1.className='sep';sw.appendChild(s1);
    var mb=btn(state.mode==='main'?'main':'staging',state.mode==='main'?'Main direction':'Staging direction',function(){state.mode=(state.mode==='main'?'staging':'main');apply();});
    mb.classList.add('act');sw.appendChild(mb);
    var s2=document.createElement('div');s2.className='sep';sw.appendChild(s2);
    sw.appendChild(btn('rotate','Move panel',function(){state.corner=(state.corner+1)%4;render();}));
  }
  function apply(){frame.setAttribute('data-device',state.device);render();if(window.__renderApp)window.__renderApp(state.mode);}
  window.__swInit=apply; render();
})();
</script>

<script type="text/babel">
const NS = window.SHERDesignSystem_84f0d7;
const { Sticky, Menu, Cart, Footer, Button, ShopTitle, ProductGrid, Accordion, ShopEditorial, ShopEditorialStg, ShopFaq } = NS;

const slot = (id, ph) => (
  <image-slot id={id} shape="rect" placeholder={ph}
    style={{ position: "absolute", inset: 0, width: "100%", height: "100%" }} />
);

const FILTERS = [
  { key: "all", label: "All" },
  { key: "lace", label: "Lace Closure" },
  { key: "zip", label: "Zip Closure" },
];
const PRODUCTS = [
  { id: "c-1", title: "Silk Lace Corset Top", price: 240, closure: "lace" },
  { id: "c-2", title: "Odile Zip Corset", price: 210, closure: "zip", soldOut: true },
  { id: "c-3", title: "Séraphine Lace Corset", price: 230, closure: "lace" },
  { id: "c-4", title: "Colette Zip Corset", price: 220, closure: "zip" },
  { id: "c-5", title: "Amara Lace Corset", price: 250, closure: "lace" },
  { id: "c-6", title: "Vesper Zip Corset", price: 215, closure: "zip" },
  { id: "c-7", title: "Lys Lace Bustier", price: 235, closure: "lace" },
];
const filtered = (f) => f === "all" ? PRODUCTS : PRODUCTS.filter((p) => p.closure === f);

const BANDS = [
  { id: "s3-what", eyebrow: "What is a Corset Top?",
    heading: "Structured Boning That Commands the Silhouette",
    paragraph: "A corset top is a fitted top built on corsetry. Thin bones run through the fabric to shape the waist and support the bust. Unlike a plain top, it holds its structure and stays put as you move. The look is firm but not stiff. SHER makes each corset top to be worn on its own, as the piece people notice first.",
    ph: "A SHER corset top on a model, showing its shaped waist and structured bust." },
  { id: "s3-closure", eyebrow: "Pick your Corset Closure Type",
    heading: "Each Corset Closure Designed for a Different Priority",
    paragraph: "The Lace Closure laces up the back through metal eyelets. Pull the cord tighter or looser to set the fit yourself. Pick this one if you want control over how firm it feels. The Zip Closure uses a separating zip. Step in, zip up, and you are done. The fit is fixed, so there is nothing to adjust. Pick this one if you want the fastest way in and out with the same clean shape.",
    ph: "A SHER corset top shown from both sides, with back lacing on one and a separating zip on the other." },
  { id: "s3-hand", eyebrow: "Quality from Inside Out",
    heading: "Each Bone Set by Hand, Not by Machine",
    paragraph: "Most brands lay the boning flat with a machine. We do it by hand. Each bone is set one at a time on a mannequin, so it follows the curve of a real body. This takes longer, but the fit is better. The top shapes you where it should and stays smooth where it should. That hand-set boning is why a SHER corset top reads elegant, never cheap. The care shows on the inside. A satin lining sits against the skin, so the top feels smooth and holds its shape. Structured bust cups keep the front clean. On lace styles, the lace is cut and placed by hand so the pattern runs true. Strong thread and finished seams mean it lasts. You can tell the quality from across the room.",
    ph: "Inside of a SHER corset top showing hand-set boning channels, satin lining, and structured bust cups." },
];

const FAQS = [
  { q: "How do I measure for a corset top?", a: "Measure your bust, waist, hip, and length. Bust matters most on a corset top, so get that one right. Keep the tape level and snug, not tight. Then match your numbers to our size chart and pick the size that fits your largest one." },
  { q: "How should a corset top fit?", a: "It should feel firm but never painful. The top edge sits flat against your chest with no gap, and the waist holds close with no space to pinch. You should still breathe and move with ease. If it hurts or leaves marks, size up." },
  { q: "What if I am between sizes?", a: "Size up. A corset top can be taken in but not let out, so the larger size gives you room to adjust. With a Lace Closure, you can cinch it further for a closer fit. With a Zip Closure, a tailor can take in the seams." },
  { q: "How do I care for my corset top?", a: "Hand wash it cold or take it to a dry cleaner. Skip the machine, since the spin can bend the boning. Lay it flat to dry, out of direct sun. Always check the care label on your piece first, as fabrics differ." },
  { q: "How do I style a corset top?", a: "Let the corset top lead. Keep the rest simple, with plain trousers, a straight skirt, or tailored denim. One clean shoe and small jewelry is enough. The top is the piece people notice, so give it room and let everything else stay quiet." },
  { q: "Should I choose a Lace or Zip Closure?", a: "Pick by preference, since the fit is the same either way. Choose Lace Closure if you want to adjust how firm it feels, or if a size change is likely. Choose Zip Closure if you want the easiest way in and out. Both give you the same shape." },
];

function MainPage() {
  const [filter, setFilter] = React.useState("all");
  const [view, setView] = React.useState("comfortable");
  const items = filtered(filter);

  return (
    <>
      {/* S-003.1 — breadcrumb, H1, subtitle, closure filter pills */}
      <section className="sec" style={{ paddingBottom: "var(--space-5)" }}>
        <div className="wrap">
          <ShopTitle
            breadcrumb={[{ label: "Shop", href: "/shop" }, { label: "Corset Tops" }]}
            heading="Shop Corset Tops"
            description="Shop corset tops built on real corsetry, in two closures. Pick Lace Closure for an adjustable fit, or Zip Closure for the easiest way in and out."
            filters={FILTERS.map((f) => ({ label: f.label, active: filter === f.key,
              onClick: () => setFilter(f.key) }))} />
        </div>
      </section>

      {/* S-003.2 — view toggle + product grid */}
      <section className="sec" style={{ paddingTop: 0 }}>
        <div className="wrap">
          <ProductGrid products={items.map((it) => ({ ...it, href: "/shop/corset-tops",
            media: slot(it.id, it.title), category: "Corset Tops" }))}
            columns={view === "compact" ? "2/2/3" : "1/1/2"} onView={setView} pageSize={12} endMark="mark"
            emptyMessage="No pieces match this filter yet. Try another closure." />
        </div>
      </section>

      {/* S-003.3 – S-003.5 — editorial bands */}
      {BANDS.map((b, i) => (
        <section key={b.id} className={"sec" + (i === 0 ? " first-band" : "")}
          style={{ background: i % 2 === 1 ? "var(--surface-tint)" : "var(--surface-raised)" }}>
          <div className="wrap">
            <ShopEditorial className="editorial" mirror={i % 2 === 1} mobileFirst="text" mobileAlign={i % 2 === 0 ? "right" : "left"}
              eyebrow={b.eyebrow} heading={b.heading} paragraph={b.paragraph}
              media={slot(b.id, b.ph)} />
          </div>
        </section>
      ))}

      {/* S-003.6 — FAQ beside its heading */}
      <section className="sec" style={{ background: "var(--surface-tint)" }}>
        <div className="wrap">
            <ShopFaq items={FAQS} />
          </div>
      </section>
    </>
  );
}

/* Staging — alternate direction: full-bleed editorial bands with no contained
   wrapper, and the FAQ stacked on a tinted band at prose width. */
function StagingPage() {
  const [filter, setFilter] = React.useState("all");
  const [view, setView] = React.useState("comfortable");
  const items = filtered(filter);

  return (
    <>
      <section className="sec" style={{ paddingBottom: "var(--space-5)" }}>
        <div className="wrap">
          <ShopTitle
            breadcrumb={[{ label: "Shop", href: "/shop" }, { label: "Corset Tops" }]}
            heading="Corset Tops by SHER"
            description="Corset tops by SHER, built on real corsetry with each bone set by hand. Choose Lace Closure for an adjustable fit or Zip Closure for effortless wear."
            filters={FILTERS.map((f) => ({ label: f.label, active: filter === f.key,
              onClick: () => setFilter(f.key) }))} />
        </div>
      </section>

      <section className="sec" style={{ paddingTop: 0 }}>
        <div className="wrap">
          <ProductGrid products={items.map((it) => ({ ...it, href: "/shop/corset-tops",
            media: slot("stg-" + it.id, it.title), category: "Corset Tops" }))}
            columns={view === "compact" ? "2/2/3" : "1/1/2"} onView={setView} pageSize={12} endMark="monogram"
            emptyMessage="No pieces match this filter yet. Try another closure." />
        </div>
      </section>

      {BANDS.map((b, i) => (
        <section key={b.id} className={"sec stg-band" + (i === 0 ? " first-band" : "")}
          style={{ background: i % 2 === 1 ? "var(--surface-tint)" : "var(--surface-raised)" }}>
          <div className="wrap">
            <ShopEditorial className="editorial" mirror={i % 2 === 1} mobileFirst="text" mobileAlign={i % 2 === 0 ? "right" : "left"} headingFont="body"
              eyebrow={b.eyebrow} heading={b.heading} paragraph={b.paragraph}
              media={slot("stg-" + b.id, b.ph)} />
          </div>
        </section>
      ))}

      <section className="sec stg-faq" style={{ background: "var(--surface-tint)" }}>
        <div className="wrap">
          <ShopFaq items={FAQS} />
        </div>
      </section>
    </>
  );
}

function App() {
  const [mode, setMode] = React.useState("main");
  const [menuOpen, setMenuOpen] = React.useState(false);
  const [cartOpen, setCartOpen] = React.useState(false);
  React.useEffect(() => {
    window.__renderApp = (m) => setMode(m);
    if (window.__swInit) window.__swInit();
  }, []);
  return (
    <>
      <Sticky cartCount={0} onMenu={() => setMenuOpen(true)} onCart={() => setCartOpen(true)}
        key={mode} announcementTone={mode === "main" ? "light" : "accent"} />
      {mode === "main" ? <MainPage /> : <StagingPage />}
      <Footer year={2026} />
      <Menu open={menuOpen} onClose={() => setMenuOpen(false)} />
      <Cart open={cartOpen} onClose={() => setCartOpen(false)} items={[]} />
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

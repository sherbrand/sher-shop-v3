<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:28px;background:var(--surface-page)}.lbl{font-family:var(--font-body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-meta);margin:0 0 12px}.row{display:flex;gap:32px;align-items:center;flex-wrap:wrap;margin-bottom:24px}</style></head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { QuantityStepper, Price } = window.SHERDesignSystem_84f0d7;
function Demo(){
  const [q,setQ]=React.useState(1);
  return (<div>
    <p className="lbl">Quantity Stepper</p>
    <div className="row">
      <QuantityStepper value={q} onChange={setQ}/>
      <QuantityStepper defaultValue={2} size="sm"/>
      <QuantityStepper defaultValue={1} disabled/>
    </div>
    <p className="lbl">Price</p>
    <div className="row">
      <Price amount={240} size="lg"/>
      <Price amount={190} compareAt={240} size="md"/>
      <Price amount={q*240} size="sm"/>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>

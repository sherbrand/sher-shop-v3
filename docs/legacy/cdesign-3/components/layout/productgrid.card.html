<!-- @dsCard group="6. Layout Components" viewport="900x1400" name="C-ProductGrid" subtitle="Shop results band · count + view toggle over ProductCard grid (columns = 1/1/2, 1/2/2, 2/2/3 | pageSize = 4, unset | endMark = none, rule, mark, monogram | showToolbar = true, false | floatingToggle = true, false)" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--surface-page);padding:24px}</style></head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { ProductGrid } = window.SHERDesignSystem_84f0d7;
const slot = (id, title) => (<image-slot id={id} shape="rect" placeholder={title}
  style={{ position: "absolute", inset: 0, width: "100%", height: "100%" }} />);
const PRODUCTS = [
  { id: "p-1", title: "Silk Lace Corset Top", price: 240 },
  { id: "p-2", title: "Odile Zip Corset", price: 210, soldOut: true },
  { id: "p-3", title: "Séraphine Lace Corset", price: 230 },
  { id: "p-4", title: "Satin Trouser Set", price: 295, compareAt: 340 },
  { id: "p-5", title: "Rue Skirt Set", price: 275 },
  { id: "p-6", title: "Aria Slip Midi", price: 260 },
].map((p) => ({ ...p, href: "/shop", media: slot(p.id, p.title) }));
const lbl={fontFamily:"var(--font-body)",fontSize:11,letterSpacing:".14em",textTransform:"uppercase",color:"var(--text-meta)",margin:"0 0 12px"};
function Demo(){
  const [view,setView]=React.useState("comfortable");
  return (<div>
    <p style={lbl}>Toolbar · toggle swaps columns “1/1/2” ⇄ “2/2/3”</p>
    <ProductGrid products={PRODUCTS} columns={view==="compact"?"2/2/3":"1/1/2"} onView={setView} />
    <p style={{...lbl,margin:"32px 0 12px"}}>pageSize=4 · Load More reveals the rest</p>
    <ProductGrid products={PRODUCTS} pageSize={4} showToolbar={false} columns="2/2/2" />
    <p style={{...lbl,margin:"32px 0 12px"}}>endMark="mark" · closes the grid when everything is shown</p>
    <ProductGrid products={PRODUCTS} pageSize={12} endMark="mark" showToolbar={false} columns="2/2/3" />
    <p style={{...lbl,margin:"32px 0 12px"}}>endMark="monogram" · the SHER mark between fading rules</p>
    <ProductGrid products={PRODUCTS.slice(0,3)} pageSize={12} endMark="monogram" showToolbar={false} columns="3/3/3" />
    <p style={{...lbl,margin:"32px 0 12px"}}>showToolbar=false · columns=“1/2/2”</p>
    <ProductGrid products={PRODUCTS.slice(0,4)} showToolbar={false} columns="1/2/2" />
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>

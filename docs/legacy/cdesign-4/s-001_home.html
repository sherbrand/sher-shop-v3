<!-- @dsCard group="7. Pages" viewport="1280x900" name="S-001 — Home" subtitle="Home page · hero carousel, categories, featured, CTA" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modern Womenswear by SHER</title>
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;height:100%;background:#c9c6bf;font-family:var(--font-body)}
  /* ---- device stage + frame ---- */
  #stage{position:fixed;inset:0;display:flex;overflow:auto;padding:20px;
    justify-content:safe center;align-items:safe center}
  .frame{position:relative;flex:none;background:var(--surface-page);
    box-shadow:0 10px 60px rgba(51,50,49,.28);overflow:hidden;
    container:sherframe / size;transform:translateZ(0)}
  .frame[data-device="mobile"]{width:390px;height:844px}
  .frame[data-device="tablet"]{width:834px;height:1112px}
  .frame[data-device="desktop"]{width:100%;max-width:1440px;height:100%}
  .frame[data-device="wide"]{width:100%;min-width:1440px;max-width:1920px;height:100%}
  .scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:auto}

  /* ---- page layout — ALL responsive via @container, never @media ---- */
  /* stepped type: aliased here, stepped in the @container blocks below */
  #root{--fs-display:var(--size-display-sm);--fs-section:var(--size-section-sm);--fs-title:var(--size-title-sm);--fs-body:var(--size-body-sm);--fs-item:var(--size-item-sm);--announce-h:2rem}
  .sec{padding:var(--space-7) var(--gutter)}
  .wrap{max-width:var(--container);margin:0 auto}
  .center{text-align:center}
  .stickyslot{position:sticky;top:0;z-index:100;transform:translateY(-115%);opacity:0;
    transition:transform var(--dur-med) var(--ease-out),opacity var(--dur-med) var(--ease-out)}
  .stickyslot.on{transform:translateY(0);opacity:1}
  .abshead{position:absolute;top:0;left:0;right:0;z-index:90}
  /* transparent-header logo: step down on tablet, smaller still on mobile */
  .abshead img{width:96px !important}
  @container sherframe (min-width:640px){ .abshead img{width:112px !important} }
  @container sherframe (min-width:1024px){ .abshead img{width:128px !important} }
  .hero{position:relative;height:520px;margin-top:calc(-1 * (var(--header-h) + var(--announce-h)))}
  /* peek carousel: banner cells drive height via a fixed portrait ratio */
  .hero.peek{height:auto}

  .intro{display:flex;flex-direction:column;gap:var(--space-3);align-items:center}
  .intro .eye{font-family:var(--font-body);font-size:var(--size-xs);letter-spacing:var(--tracking-label);
    text-transform:uppercase;color:var(--text-meta)}
  .intro h1{margin:0;font-size:var(--fs-display)}

  .tiles{display:grid;grid-template-columns:1fr;gap:var(--space-3)}
  .tile{position:relative;display:block;aspect-ratio:4/5;overflow:hidden;border-radius:var(--radius-sm);text-decoration:none}
  .tile .lab{position:absolute;inset:0;display:flex;align-items:flex-end;padding:var(--space-4);
    background:linear-gradient(180deg,rgba(51,50,49,0) 45%,var(--scrim) 100%);pointer-events:none}
  .tile h2{margin:0;color:var(--sher-white);font-size:var(--fs-title)}


  .close h2{margin:0 0 var(--space-4);font-size:var(--fs-section)}
  .close p{max-width:46ch;margin:0 auto var(--space-6);color:var(--text-default);font-size:var(--fs-body)}

  /* section mark: bottom gap matches the section's own stepped top padding */
  .secmark{margin-bottom:var(--space-7)}
  .shead{margin:0 0 var(--space-6);font-size:var(--fs-title)}
  .sublab{font-family:var(--font-body);font-size:var(--size-xs);letter-spacing:var(--tracking-label);
    text-transform:uppercase;color:var(--text-meta);margin:0 0 var(--space-4)}

  /* container breakpoints: 640 / 768 / 1024 / 1280 */
  @container sherframe (min-width:640px){
    #root{--fs-display:var(--size-display-md);--fs-section:var(--size-section-md);--fs-title:var(--size-title-md);--fs-body:var(--size-body-md);--fs-item:var(--size-item-md);--gutter:var(--space-5);--announce-h:2.25rem}
    .tiles{grid-template-columns:1fr 1fr;gap:var(--space-4)}
    .hero{height:600px}
  }
  @container sherframe (min-width:768px){
    .sec{padding:var(--space-8) var(--gutter)}
    .secmark{margin-bottom:var(--space-8)}
  }
  @container sherframe (min-width:1024px){
    #root{--fs-display:var(--size-display-lg);--fs-section:var(--size-section-lg);--fs-title:var(--size-title-lg);--fs-body:var(--size-body-lg);--fs-item:var(--size-item-lg);--gutter:var(--space-6)}
    .sec{padding:var(--space-9) var(--gutter)}
    .secmark{margin-bottom:var(--space-9)}
    .hero{height:720px}
    .stg-hero{grid-template-columns:1.1fr 1fr}
  }

  /* ---- staging alt direction ---- */
  .hero.stg-hero-fill{height:70cqh}
  @container sherframe (min-width:640px){ .hero.stg-hero-fill{height:75cqh} }
  @container sherframe (min-width:1024px){ .hero.stg-hero-fill{height:80cqh} }
  .stg-hero{display:grid;grid-template-columns:1fr;min-height:520px}
  .stg-hero .txt{display:flex;flex-direction:column;justify-content:center;gap:var(--space-4);
    padding:var(--space-8) var(--gutter);background:var(--surface-raised)}
  .stg-hero .txt h1{margin:0;font-size:var(--fs-display)}
  /* ---- floating device switcher (tooling chrome) ---- */
  #sw{position:fixed;z-index:2000;display:flex;gap:6px;padding:6px;border-radius:var(--radius-md);
    background:var(--surface-inverse);box-shadow:0 6px 24px rgba(51,50,49,.35)}
  #sw.c0{top:14px;left:14px}#sw.c1{top:14px;right:14px}#sw.c2{bottom:14px;right:14px}#sw.c3{bottom:14px;left:14px}
  #sw button{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
    border:none;border-radius:var(--radius-sm);background:transparent;color:#cfcac2;cursor:pointer;padding:0}
  #sw button:hover{color:#fff}
  #sw button.act{background:rgba(250,249,246,.16);color:#fff}
  #sw .sep{width:1px;background:rgba(250,249,246,.2);margin:2px 2px}
  #sw svg{width:17px;height:17px;display:block}
</style>
</head>
<body>
<div id="sw" class="c1"></div>
<div id="stage"><div class="frame" id="frame" data-device="desktop"><div class="scroll" id="scroll"><div id="root"></div></div></div></div>

<script src="image-slot.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>

<!-- ---- floating switcher logic (vanilla, tooling only) ---- -->
<script>
(function(){
  var ICON={
    mobile:'<rect x="7" y="3" width="10" height="18" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/>',
    tablet:'<rect x="5" y="3" width="14" height="18" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/>',
    desktop:'<rect x="3" y="4" width="18" height="12" rx="2"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/>',
    wide:'<rect x="1" y="6" width="22" height="10" rx="2"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/>',
    main:'<circle cx="12" cy="12" r="8"/>',
    staging:'<circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/>',
    rotate:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>'
  };
  function svg(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
  var state={device:'desktop',mode:'main',corner:1};
  var sw=document.getElementById('sw'), frame=document.getElementById('frame');
  function btn(icon,title,on){var b=document.createElement('button');b.innerHTML=svg(ICON[icon]);b.title=title;b.setAttribute('aria-label',title);b.onclick=on;return b;}
  function render(){
    sw.className='c'+state.corner; sw.innerHTML='';
    [['mobile','Mobile'],['tablet','Tablet'],['desktop','Desktop'],['wide','Wide']].forEach(function(d){
      var b=btn(d[0],d[1]+' view',function(){state.device=d[0];apply();});
      if(state.device===d[0])b.classList.add('act');sw.appendChild(b);});
    var s1=document.createElement('div');s1.className='sep';sw.appendChild(s1);
    var mb=btn(state.mode==='main'?'main':'staging',state.mode==='main'?'Main direction':'Staging direction',function(){state.mode=(state.mode==='main'?'staging':'main');apply();});
    mb.classList.add('act');sw.appendChild(mb);
    var s2=document.createElement('div');s2.className='sep';sw.appendChild(s2);
    sw.appendChild(btn('rotate','Move panel',function(){state.corner=(state.corner+1)%4;render();}));
  }
  window.__setMode=function(){};
  function apply(){frame.setAttribute('data-device',state.device);render();if(window.__renderApp)window.__renderApp(state.mode);}
  window.__swInit=apply; render();
})();
</script>

<!-- ---- page app ---- -->
<script type="text/babel">
const NS = window.SHERDesignSystem_84f0d7;
const { Transparent, Sticky, Menu, Cart, Footer, HeroCarousel, HeroCarouselStg, HeroTitle, CategoryGrid, ProductGrid, Divider, Button, IconButton, Icon, ProductCard } = NS;

const HERO_SLIDES = [
  { image: "assets/hero-cocktail-dress.png", alt: "A SHER cocktail dress in ribbed chartreuse, worn on a concrete set" },
  { bg: "var(--sher-text)" },
  { bg: "var(--sher-dark)" },
  { bg: "var(--sher-text)" },
];
const STAGING_SLIDES = [
  { eyebrow: "Refined Sensuality", heading: "Made to Be Seen", cta: { label: "Shop the Collection", href: "/shop" } },
  { eyebrow: "Effortless Corsetry", heading: "The Corset Top, Rewritten", cta: { label: "Corset Tops", href: "/corset-tops" } },
  { eyebrow: "Matching Sets", heading: "Feminine Silhouette, Magnetic Presence", cta: { label: "Shop Sets", href: "/matching-sets" } },
];
const CATS = [
  { label: "Shop Corset Tops", href: "/corset-tops", id: "cat-corsets", ph: "Corset tops" },
  { label: "Shop Matching Sets", href: "/matching-sets", id: "cat-sets", ph: "Matching sets" },
  { label: "Shop Cocktail Dresses", href: "/cocktail-dresses", id: "cat-dresses", ph: "Cocktail dresses" },
  { label: "Shop All Products", href: "/shop", id: "cat-all", ph: "The full range" },
];
const FEATURED = [
  { title: "Silk Lace Corset Top", price: 240, category: "Corset Tops", href: "/shop", id: "feat-1", ph: "Silk Lace Corset Top" },
  { title: "Satin Trouser Set", price: 295, compareAt: 340, category: "Matching Sets", href: "/shop", id: "feat-2", ph: "Satin Trouser Set" },
];

const Slot = ({ id, ph }) => (
  <image-slot id={id} shape="rect" placeholder={ph}
    style={{ position: "absolute", inset: 0, width: "100%", height: "100%" }} />
);

function CategoryTile({ c }) {  return (
    <a className="tile" href={c.href}>
      <Slot id={c.id} ph={c.ph} />
      <span className="lab"><h2>{c.label}</h2></span>
    </a>
  );
}

function MainHome() {
  return (
    <>
      <div className="hero peek">
        <div className="abshead"><Transparent cartCount={0} announcementTone="accent" onMenu={window.__openMenu} onCart={window.__openCart} /></div>
        <HeroCarousel slides={HERO_SLIDES} />
      </div>

      <HeroTitle style={{ marginTop: "var(--space-5)" }} eyebrow="Refined Sensuality" heading="Modern Womenswear by SHER" headingLevel={1}
        description="Every SHER piece is made by hand, down to the boning set one at a time. Sensual, refined, and never cheap." />

      <div style={{ maxWidth: "var(--container-media)", margin: "var(--space-5) auto 0" }}>
        <CategoryGrid items={CATS.map((c) => ({
          label: c.label, href: c.href, id: c.id,
          media: <Slot id={c.id} ph={c.ph} />,
        }))} />
      </div>

      <section className="sec" style={{ background: "var(--surface-page)" }}>
        <div className="wrap">
          <Divider className="secmark" />
          <ProductGrid heading="Featured Products" showToolbar={false} columns="1/2/2"
            products={FEATURED.map((p) => ({ ...p, media: <Slot id={p.id} ph={p.ph} /> }))} />
        </div>
      </section>

      <HeroTitle headingLevel={2} background="var(--surface-raised)"
        style={{ paddingTop: "var(--space-9)", paddingBottom: "var(--space-9)" }}
        heading="Made to Be Seen"
        description="The right piece turns heads before you say a word. Find yours and own the room.">
        <Button as="a" href="/shop" variant="accent" size="lg">Shop the Full Collection</Button>
      </HeroTitle>

      <Footer year={2026} />
    </>
  );
}

function StagingHome() {
  return (
    <>
      <div className="hero stg-hero-fill">
        <div className="abshead"><Transparent cartCount={0} announcementTone="light" onMenu={window.__openMenu} onCart={window.__openCart} /></div>
        <HeroCarouselStg slides={STAGING_SLIDES} height="fill" />
      </div>

      <div className="stg-hero" style={{ gridTemplateColumns: "1fr" }}>
        <div className="txt">
          <span className="eye" style={{ fontFamily: "var(--font-body)", fontSize: "var(--size-xs)", letterSpacing: "var(--tracking-label)", textTransform: "uppercase", color: "var(--text-meta)" }}>Refined Sensuality</span>
          <h1>Modern Womenswear by SHER</h1>
          <p style={{ margin: 0, color: "var(--text-default)", fontSize: "var(--fs-body)", maxWidth: "34ch" }}>Structured corsetry, shaped by hand — sensual without looking cheap, magnetic without trying.</p>
          <div style={{ display: "flex", gap: "var(--space-3)", flexWrap: "wrap" }}>
            <Button as="a" href="/shop" variant="primary" size="lg">Shop the Collection</Button>
            <Button as="a" href="/about" variant="accent" size="lg">Read our Story</Button>
          </div>
        </div>
      </div>

      <CategoryGrid style={{ marginTop: "var(--space-5)" }} items={CATS.map((c) => ({
        label: c.label, href: c.href, id: "stg-" + c.id,
        media: <Slot id={"stg-" + c.id} ph={c.ph} />,
      }))} />

      <section className="sec">
        <div className="wrap">
          <Divider variant="monogram" className="secmark" />
          <ProductGrid heading="Featured Products" showToolbar={false} columns="1/2/2"
            products={FEATURED.map((p) => ({ ...p, media: <Slot id={p.id} ph={p.ph} /> }))} />
        </div>
      </section>

      <section className="sec" style={{ background: "var(--accent)" }}>
        <div className="wrap" style={{ maxWidth: "var(--container-prose)" }}>
          <h2 style={{ margin: "0 0 var(--space-4)", color: "var(--sher-white)", fontSize: "var(--fs-section)" }}>Made to Be Seen</h2>
          <p style={{ color: "var(--sher-white)", opacity: 0.9, fontSize: "var(--fs-body)", maxWidth: "46ch", margin: "0 0 var(--space-6)" }}>The right piece turns heads before you say a word. Find yours and own the room.</p>
          <Button as="a" href="/shop" variant="primary" size="lg" style={{ background: "var(--sher-white)", color: "var(--sher-dark)" }}>Shop the Full Collection</Button>
        </div>
      </section>

      <Footer year={2026} />
    </>
  );
}

function App() {
  const [mode, setMode] = React.useState("main");
  const [scrolled, setScrolled] = React.useState(false);
  const [menuOpen, setMenuOpen] = React.useState(false);
  const [cartOpen, setCartOpen] = React.useState(false);

  React.useEffect(() => {
    window.__renderApp = (m) => setMode(m);
    window.__openMenu = () => setMenuOpen(true);
    window.__openCart = () => setCartOpen(true);
    if (window.__swInit) window.__swInit();
  }, []);

  // C-Sticky takes over once the hero scrolls out of view (per the PRD) —
  // measured against the hero element, not a viewport fraction
  React.useEffect(() => {
    const sc = document.getElementById("scroll");
    if (!sc) return;
    const check = () => {
      const hero = document.querySelector(".hero");
      if (!hero) { setScrolled(true); return; }
      setScrolled(hero.getBoundingClientRect().bottom <= sc.getBoundingClientRect().top);
    };
    sc.addEventListener("scroll", check, { passive: true });
    window.addEventListener("resize", check);
    check();
    return () => {
      sc.removeEventListener("scroll", check);
      window.removeEventListener("resize", check);
    };
  }, [mode]);

  return (
    <>
      <div className={"stickyslot" + (scrolled ? " on" : "")}>
        <Sticky cartCount={0} onMenu={() => setMenuOpen(true)} onCart={() => setCartOpen(true)}
        key={mode}
        announcementTone={mode === "main" ? "light" : "accent"} />
      </div>
      {mode === "main" ? <MainHome /> : <StagingHome />}
      <Menu open={menuOpen} onClose={() => setMenuOpen(false)} onNavigate={() => {}} />
      <Cart open={cartOpen} onClose={() => setCartOpen(false)} items={[]} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

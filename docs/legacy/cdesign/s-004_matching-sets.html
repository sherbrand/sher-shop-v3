<!-- @dsCard group="7. Pages" viewport="1280x900" name="S-004 — Matching Sets" subtitle="Category + editorial page · set-type filter, grid, three editorial bands, FAQ" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matching Sets: The Co-Ord, Made to Be Seen</title>
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;height:100%;background:#c9c6bf;font-family:var(--font-body)}
  #stage{position:fixed;inset:0;display:flex;overflow:auto;padding:20px;
    justify-content:safe center;align-items:safe center}
  .frame{position:relative;flex:none;background:var(--surface-page);
    box-shadow:0 10px 60px rgba(51,50,49,.28);overflow:hidden;
    container:sherframe / size;transform:translateZ(0)}
  .frame[data-device="mobile"]{width:390px;height:844px}
  .frame[data-device="tablet"]{width:834px;height:1112px}
  .frame[data-device="desktop"]{width:100%;height:100%}
  .frame[data-device="wide"]{width:1920px;height:100%}
  .scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}

  #root{--fs-hero:var(--text-hero-sm);--fs-section:var(--text-section-sm);--fs-body:var(--text-body-sm);--fs-item:var(--text-item-sm);--fs-announce:var(--text-announce-sm);--announce-h:2rem;--fs-display:var(--text-display-sm)}
  .sec{padding:var(--space-7) var(--gutter)}
  .wrap{max-width:var(--container);margin:0 auto}
  .prose{max-width:var(--container-prose);margin:0 auto}

  .pgrid{display:grid;gap:var(--space-4)}
  .editorial{padding-top:var(--space-4)}
  /* editorial bands run more compact than a standard section */
  section.sec:has(> .wrap > .editorial){padding-top:var(--space-5);padding-bottom:var(--space-5)}
  /* Staging: a double hairline marks the shift out of the grid */
  .stg-band.first-band{border-top:3px double var(--border-strong)}
  .stg-band + .stg-band{border-top:1px solid var(--border-default)}


  @container sherframe (min-width:640px){
    #root{--fs-hero:var(--text-hero-md);--fs-section:var(--text-section-md);--fs-body:var(--text-body-md);--fs-item:var(--text-item-md);--gutter:var(--space-5);--fs-announce:var(--text-announce-lg);--announce-h:2.25rem;--fs-display:var(--text-display-md)}
    .sec{padding:var(--space-8) var(--gutter)}
  }
  @container sherframe (min-width:768px){
    .editorial{padding-top:0}
    section.sec:has(> .wrap > .editorial){padding-top:var(--space-6);padding-bottom:var(--space-6)}
  }
  @container sherframe (min-width:1024px){
    #root{--fs-hero:var(--text-hero-lg);--fs-section:var(--text-section-lg);--gutter:var(--space-6);--fs-body:var(--text-body-lg);--fs-item:var(--text-item-lg);--fs-display:var(--text-display-lg)}
    .sec{padding:var(--space-9) var(--gutter)}
    section.sec:has(> .wrap > .editorial){padding-top:var(--space-7);padding-bottom:var(--space-7)}
  }

  /* staging alt direction */
  .stg-faq{background:var(--surface-raised)}
  .stg-faq .panel{background:var(--surface-page);padding:0 var(--space-5);border-radius:var(--radius-sm)}

  #sw{position:fixed;z-index:2000;display:flex;gap:6px;padding:6px;border-radius:var(--radius-md);
    background:var(--surface-inverse);box-shadow:0 6px 24px rgba(51,50,49,.35)}
  #sw.c0{top:14px;left:14px}#sw.c1{top:14px;right:14px}#sw.c2{bottom:14px;right:14px}#sw.c3{bottom:14px;left:14px}
  #sw button{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
    border:none;border-radius:var(--radius-sm);background:transparent;color:#cfcac2;cursor:pointer;padding:0}
  #sw button:hover{color:#fff}#sw button.act{background:rgba(250,249,246,.16);color:#fff}
  #sw .sep{width:1px;background:rgba(250,249,246,.2);margin:2px 2px}
  #sw svg{width:17px;height:17px;display:block}
</style>
</head>
<body>
<div id="sw" class="c1"></div>
<div id="stage"><div class="frame" id="frame" data-device="desktop"><div class="scroll" id="scroll"><div id="root"></div></div></div></div>

<script src="image-slot.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>

<script>
(function(){
  var ICON={
    mobile:'<rect x="7" y="3" width="10" height="18" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/>',
    tablet:'<rect x="5" y="3" width="14" height="18" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/>',
    desktop:'<rect x="3" y="4" width="18" height="12" rx="2"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/>',
    wide:'<rect x="1" y="6" width="22" height="10" rx="2"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/>',
    main:'<circle cx="12" cy="12" r="8"/>',
    staging:'<circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/>',
    rotate:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>'
  };
  function svg(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
  var state={device:'desktop',mode:'main',corner:1};
  var sw=document.getElementById('sw'), frame=document.getElementById('frame');
  function btn(icon,title,on){var b=document.createElement('button');b.innerHTML=svg(ICON[icon]);b.title=title;b.setAttribute('aria-label',title);b.onclick=on;return b;}
  function render(){
    sw.className='c'+state.corner; sw.innerHTML='';
    [['mobile','Mobile'],['tablet','Tablet'],['desktop','Desktop'],['wide','Wide']].forEach(function(d){
      var b=btn(d[0],d[1]+' view',function(){state.device=d[0];apply();});
      if(state.device===d[0])b.classList.add('act');sw.appendChild(b);});
    var s1=document.createElement('div');s1.className='sep';sw.appendChild(s1);
    var mb=btn(state.mode==='main'?'main':'staging',state.mode==='main'?'Main direction':'Staging direction',function(){state.mode=(state.mode==='main'?'staging':'main');apply();});
    mb.classList.add('act');sw.appendChild(mb);
    var s2=document.createElement('div');s2.className='sep';sw.appendChild(s2);
    sw.appendChild(btn('rotate','Move panel',function(){state.corner=(state.corner+1)%4;render();}));
  }
  function apply(){frame.setAttribute('data-device',state.device);render();if(window.__renderApp)window.__renderApp(state.mode);}
  window.__swInit=apply; render();
})();
</script>

<script type="text/babel">
const NS = window.SHERDesignSystem_84f0d7;
const { Sticky, Menu, Cart, Footer, Button, ShopTitle, ProductGrid, Accordion, ShopEditorial, ShopEditorialStg, ShopFaq } = NS;

const slot = (id, ph) => (
  <image-slot id={id} shape="rect" placeholder={ph}
    style={{ position: "absolute", inset: 0, width: "100%", height: "100%" }} />
);

const FILTERS = [
  { key: "all", label: "All" },
  { key: "skirt", label: "Skirt Set" },
  { key: "trouser", label: "Trouser Set" },
];
const PRODUCTS = [
  { id: "m-1", title: "Odette Skirt Set", price: 340, setType: "skirt" },
  { id: "m-2", title: "Rue Trouser Set", price: 360, setType: "trouser" },
  { id: "m-3", title: "Colette Skirt Set", price: 330, setType: "skirt", soldOut: true },
  { id: "m-4", title: "Vesper Trouser Set", price: 370, setType: "trouser" },
  { id: "m-5", title: "Lys Skirt Set", price: 345, setType: "skirt" },
  { id: "m-6", title: "Mira Trouser Set", price: 355, setType: "trouser" },
];
const filtered = (f) => f === "all" ? PRODUCTS : PRODUCTS.filter((p) => p.setType === f);

const BANDS = [
  { id: "s4-what", eyebrow: "What is a Matching Set?",
    heading: "One Look, Two Pieces That Belong Together",
    paragraph: "A matching set is a top and a bottom made from the same fabric to be worn together. Some call it a co-ord or a two-piece set. The two pieces share the same color, cut, and finish, so they read as one outfit, not two separate items. You put on both and the look is complete, with nothing left to match.",
    ph: "A SHER matching set on a model, showing the top and bottom worn as one look." },
  { id: "s4-type", eyebrow: "Pick your Matching Set Type",
    heading: "Each Set Built for a Different Look",
    paragraph: "The Skirt Set pairs the top with a matching skirt. It gives a soft, feminine line that moves as you walk. Pick this one for a look that feels dressed up without effort, day or evening. The Trouser Set pairs the top with matching trousers. It gives a longer, sharper line and reads a little bolder. Pick this one when you want to look put together and ready for anything.",
    ph: "A SHER Skirt Set and Trouser Set side by side on models, showing both set types." },
  { id: "s4-quality", eyebrow: "Quality from Inside Out",
    heading: "Cut to Sit Right Together",
    paragraph: "We cut both pieces to work as a pair. The top ends where the bottom begins, so the hems meet with no gap and no overlap. The color is dyed in the same run, so the two pieces never look off. Each set is made together, checked together, and sold together. That is why a SHER set sits right the moment you put it on. The quality shows up close. Both pieces use the same soft, weighted fabric that holds its shape and drapes clean. Seams are finished so nothing frays, and the color is set to fade evenly over time. Zips and closures are chosen to last. Made this way, the set keeps looking like new wash after wash.",
    ph: "Close view of a SHER matching set showing the top hem meeting the waistband, with inside seams and fabric detail." },
];

const FAQS = [
  { q: "How do I measure for a matching set?", a: "Measure your bust, waist, hip, and the length of each piece. Waist matters most on a set, since both pieces meet there. Keep the tape level and snug. Then match your numbers to our size chart and choose the size that fits your waist." },
  { q: "How should a matching set fit?", a: "The top should feel firm and hold close. The bottom sits at your natural waist, though the exact spot can shift by style. When both are on, the top hem and the waistband should meet with no skin showing between them. You should still move with ease." },
  { q: "What if I am between sizes?", a: "Size up the top. It can be taken in but not let out, so the larger size gives you room to adjust. For the bottom, choose the size that fits your waist. A tailor can then take in either piece for a closer fit." },
  { q: "How do I care for my matching set?", a: "Wash by fabric: hand wash, machine wash cold, or dry clean. Always wash both pieces together so they fade at the same rate and stay matched. Lay them flat to dry, out of direct sun. Check the care label on your set first, as fabrics differ." },
  { q: "How do I style a matching set?", a: "Wear both pieces together as one look. The set does the work, so keep the rest simple. One clean shoe and small jewelry is enough. Adding busy accessories only breaks the line the two pieces make." },
  { q: "Can I buy the top and bottom on their own?", a: "No. Each set is sold only as a pair. The two pieces are cut, dyed, and finished to match, so splitting them would break the look they are made for. You buy the set and wear it as one." },
];

function MainPage() {
  const [filter, setFilter] = React.useState("all");
  const [view, setView] = React.useState("comfortable");
  const items = filtered(filter);

  return (
    <>
      {/* S-004.1 — breadcrumb, H1, subtitle, closure filter pills */}
      <section className="sec" style={{ paddingBottom: "var(--space-5)" }}>
        <div className="wrap">
          <ShopTitle
            breadcrumb={[{ label: "Shop", href: "/shop" }, { label: "Matching Sets" }]}
            heading="Shop Matching Sets"
            description="Shop matching sets that pair a corset top with a skirt or trousers. Choose a Skirt Set for a soft, feminine line, or a Trouser Set for a sharp, sleek one."
            filters={FILTERS.map((f) => ({ label: f.label, active: filter === f.key,
              onClick: () => setFilter(f.key) }))} />
        </div>
      </section>

      {/* S-004.2 — view toggle + product grid */}
      <section className="sec" style={{ paddingTop: 0 }}>
        <div className="wrap">
          <ProductGrid products={items.map((it) => ({ ...it, href: "/shop/matching-sets",
            media: slot(it.id, it.title), category: "Matching Sets" }))}
            columns={view === "compact" ? "2/2/3" : "1/1/2"} onView={setView} pageSize={12}
            emptyMessage="No pieces match this filter yet. Try another set type." />
        </div>
      </section>

      {/* S-004.3 – S-004.5 — editorial bands */}
      {BANDS.map((b, i) => (
        <section key={b.id} className={"sec" + (i === 0 ? " first-band" : "")}
          style={{ background: i % 2 === 1 ? "var(--surface-tint)" : "var(--surface-raised)" }}>
          <div className="wrap">
            <ShopEditorial className="editorial" mirror={i % 2 === 1} mobileFirst="text" mobileAlign={i % 2 === 0 ? "right" : "left"}
              eyebrow={b.eyebrow} heading={b.heading} paragraph={b.paragraph}
              media={slot(b.id, b.ph)} />
          </div>
        </section>
      ))}

      {/* S-004.6 — FAQ beside its heading */}
      <section className="sec" style={{ background: "var(--surface-tint)" }}>
        <div className="wrap">
            <ShopFaq items={FAQS} />
          </div>
      </section>
    </>
  );
}

/* Staging — alternate direction: full-bleed editorial bands with no contained
   wrapper, and the FAQ stacked on a tinted band at prose width. */
function StagingPage() {
  const [filter, setFilter] = React.useState("all");
  const [view, setView] = React.useState("comfortable");
  const items = filtered(filter);

  return (
    <>
      <section className="sec" style={{ paddingBottom: "var(--space-5)" }}>
        <div className="wrap">
          <ShopTitle
            breadcrumb={[{ label: "Shop", href: "/shop" }, { label: "Matching Sets" }]}
            heading="Matching Sets by SHER"
            description="Matching sets by SHER, cut to sit together as one look. Choose a Skirt Set for a soft line or a Trouser Set for a sharp one."
            filters={FILTERS.map((f) => ({ label: f.label, active: filter === f.key,
              onClick: () => setFilter(f.key) }))} />
        </div>
      </section>

      <section className="sec" style={{ paddingTop: 0 }}>
        <div className="wrap">
          <ProductGrid products={items.map((it) => ({ ...it, href: "/shop/matching-sets",
            media: slot("stg-" + it.id, it.title), category: "Matching Sets" }))}
            columns={view === "compact" ? "2/2/3" : "1/1/2"} onView={setView} pageSize={12}
            emptyMessage="No pieces match this filter yet. Try another set type." />
        </div>
      </section>

      {BANDS.map((b, i) => (
        <section key={b.id} className={"sec stg-band" + (i === 0 ? " first-band" : "")}
          style={{ background: i % 2 === 1 ? "var(--surface-tint)" : "var(--surface-raised)" }}>
          <div className="wrap">
            <ShopEditorial className="editorial" mirror={i % 2 === 1} mobileFirst="text" headingFont="body"
              eyebrow={b.eyebrow} heading={b.heading} paragraph={b.paragraph}
              media={slot("stg-" + b.id, b.ph)} />
          </div>
        </section>
      ))}

      <section className="sec stg-faq" style={{ background: "var(--surface-tint)" }}>
        <div className="prose" style={{ display: "flex", flexDirection: "column", gap: "var(--space-5)" }}>
          <h2 style={{ margin: 0, fontSize: "var(--fs-section)", textAlign: "center" }}>Frequently Asked Questions</h2>
          <div className="panel"><Accordion items={FAQS} /></div>
          <div style={{ display: "flex", justifyContent: "center" }}>
            <Button as="a" href="/shop/matching-sets" variant="accent" size="lg">Shop Corset Tops</Button>
          </div>
        </div>
      </section>
    </>
  );
}

function App() {
  const [mode, setMode] = React.useState("main");
  const [menuOpen, setMenuOpen] = React.useState(false);
  const [cartOpen, setCartOpen] = React.useState(false);
  React.useEffect(() => {
    window.__renderApp = (m) => setMode(m);
    if (window.__swInit) window.__swInit();
  }, []);
  return (
    <>
      <Sticky cartCount={0} onMenu={() => setMenuOpen(true)} onCart={() => setCartOpen(true)} />
      {mode === "main" ? <MainPage /> : <StagingPage />}
      <Footer year={2026} />
      <Menu open={menuOpen} onClose={() => setMenuOpen(false)} />
      <Cart open={cartOpen} onClose={() => setCartOpen(false)} items={[]} />
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

<!-- @dsCard group="5. Module Components" viewport="700x300" name="Buttons" subtitle="CTA, pill & icon buttons (Button: variant = primary, accent, secondary, ghost | size = sm, md, lg | fullWidth, disabled = true, false | as = button, a | ButtonPill: active = true/false)" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:28px;background:var(--surface-page)}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.lbl{font-family:var(--font-body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);width:100%;margin-bottom:2px}</style></head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, ButtonPill, IconButton, Icon } = window.SHERDesignSystem_84f0d7;
function Demo(){
  const [f,setF]=React.useState("lace");
  return (<div>
    <div className="row"><span className="lbl">Button — variants</span>
      <Button variant="primary">Add to Cart</Button>
      <Button variant="accent">Buy Now</Button>
      <Button variant="secondary">Continue Shopping</Button>
      <Button variant="ghost">Shop All</Button>
      <Button variant="primary" disabled>Sold Out</Button>
    </div>
    <div className="row"><span className="lbl">Button — sizes</span>
      <Button size="sm">Small</Button>
      <Button size="md">Medium</Button>
      <Button size="lg">Large</Button>
    </div>
    <div className="row"><span className="lbl">Button Pill — filter</span>
      <ButtonPill active={f==="lace"} onClick={()=>setF("lace")}>Lace Closure</ButtonPill>
      <ButtonPill active={f==="zip"} onClick={()=>setF("zip")}>Zip Closure</ButtonPill>
      <ButtonPill active={f==="all"} onClick={()=>setF("all")}>All</ButtonPill>
    </div>
    <div className="row"><span className="lbl">Icon Button</span>
      <IconButton label="Menu"><Icon name="menu" size={24}/></IconButton>
      <IconButton label="Cart"><Icon name="bag" size={24}/></IconButton>
      <IconButton label="Close"><Icon name="close" size={24}/></IconButton>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--surface-page)}
.row{display:flex;align-items:baseline;gap:20px;padding:10px 0;border-bottom:1px solid var(--border-default)}
.k{font-family:var(--font-body);font-size:11px;color:var(--text-muted);width:190px;flex-shrink:0}
.n{font-family:var(--font-body);font-size:11px;color:var(--text-meta);margin-left:auto;flex-shrink:0}</style></head><body>
<div class="row">
  <span class="k">display · 0.05em</span>
  <span style="font-family:var(--font-display);text-transform:uppercase;letter-spacing:var(--tracking-display);font-size:26px;color:var(--text-strong)">Made to Be Seen</span>

</div>
<div class="row">
  <span class="k">control · 0.14em</span>
  <span style="font-family:var(--font-display);text-transform:uppercase;letter-spacing:var(--tracking-control);font-size:14px;font-weight:500;color:var(--text-strong)">Add to Cart</span>

</div>
<div class="row">
  <span class="k">label · 0.18em</span>

  <span class="n">eyebrows, counts, badges</span>
</div>
<div class="row" style="border-bottom:none">
  <span class="k">body · 0</span>
  <span style="font-family:var(--font-body);letter-spacing:var(--tracking-body);font-size:16px;color:var(--text-default)">Structured corsetry, shaped by hand.</span>
  <span class="n">prose</span>
</div>
</body></html>
